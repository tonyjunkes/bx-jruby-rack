plugins {
    id 'java-library'
}

group = 'modules.bxjrubyrack'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    compileOnly "io.boxlang:boxlang:${boxlangVersion}"
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'
    testImplementation "io.boxlang:boxlang:${boxlangVersion}"
    testImplementation 'io.boxlang:boxlang-servlet:1.18.6@jar'
    testImplementation 'org.eclipse.jetty:jetty-server:12.0.36'
    testImplementation 'org.eclipse.jetty.ee9:jetty-ee9-servlet:12.0.36'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
    testImplementation 'org.apiguardian:apiguardian-api:1.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PRIVATE
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('gatewayJar', Jar) {
    dependsOn classes
    archiveClassifier = 'gateway'
    from(sourceSets.main.output) {
        include 'modules/bxjrubyrack/gateway/**'
    }
}

tasks.named('jar') {
    exclude 'modules/bxjrubyrack/gateway/**'
}

tasks.register('verifyModuleMetadata') {
    inputs.files('box.json', 'gradle.properties', 'src/main/bx/ModuleConfig.bx')
    def releaseVersion = project.version.toString()
    def requiredCore = coreVersion
    inputs.property('version', releaseVersion)
    inputs.property('coreVersion', requiredCore)

    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('box.json'))
        def configuredProperties = new Properties()
        file('gradle.properties').withReader('UTF-8') {
            configuredProperties.load(it)
        }
        def semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
        if (!(releaseVersion ==~ semver)) {
            throw new GradleException("Invalid module release version: ${releaseVersion}")
        }

        def descriptors = file('src/main/bx/ModuleConfig.bx').getText('UTF-8') =~ /(?m)^\s*this\.version\s*=\s*"([^"]+)"\s*;/
        if (descriptors.count != 1 || manifest.version != releaseVersion ||
            configuredProperties.getProperty('version') != releaseVersion || descriptors[0][1] != releaseVersion) {
            throw new GradleException('box.json, gradle.properties, and ModuleConfig.bx versions must match')
        }
        if (manifest.slug != 'bx-jruby-rack' || manifest.boxlang?.moduleName != 'bxjrubyrack') {
            throw new GradleException('The package slug must be bx-jruby-rack and runtime moduleName must be bxjrubyrack')
        }
        if (manifest.dependencies['bx-jruby'] != requiredCore) {
            throw new GradleException('The bx-jruby dependency must match the coreVersion compatibility baseline')
        }
        def expectedLocation = "https://github.com/tonyjunkes/bx-jruby-rack/releases/download/${releaseVersion}/bx-jruby-rack-${releaseVersion}.zip"
        if (manifest.location != expectedLocation) {
            throw new GradleException('ForgeBox location must point to this version of the compiled GitHub release ZIP')
        }
    }
}

tasks.register('createModuleStructure', Sync) {
    dependsOn jar, gatewayJar, verifyModuleMetadata
    into layout.buildDirectory.dir('module')
    from(tasks.jar) {
        into 'libs'
    }
    from(tasks.gatewayJar) {
        into 'gateway'
    }
    from('src/main/bx')
    from('.') {
        include 'box.json', 'README.md', 'SKILL.md', 'LICENSE', 'CHANGELOG.md', 'THIRD-PARTY-NOTICES.md', 'AGENTS.md'
    }
    from('docs') {
        into 'docs'
        exclude 'implementation-spec.md'
    }
    from('examples') {
        into 'examples'
    }
    from('src/test/fixtures') {
        into 'examples'
        exclude '**/log/**', '**/tmp/**', '**/vendor/**', '**/.bundle/**'
    }
}

tasks.register('moduleZip', Zip) {
    dependsOn createModuleStructure
    from(layout.buildDirectory.dir('module'))
    archiveFileName = "bx-jruby-rack-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.register('moduleChecksum') {
    dependsOn moduleZip
    def archive = tasks.named('moduleZip', Zip).flatMap { it.archiveFile }
    def checksum = layout.buildDirectory.file("distributions/bx-jruby-rack-${version}.zip.sha256")
    inputs.file(archive)
    outputs.file(checksum)

    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.get().asFile.withInputStream { stream ->
            new java.security.DigestInputStream(stream, digest).transferTo(java.io.OutputStream.nullOutputStream())
        }
        def hash = java.util.HexFormat.of().formatHex(digest.digest())
        checksum.get().asFile.setText("${hash}  ${archive.get().asFile.name}\n", 'US-ASCII')
    }
}

tasks.register('verifyPackage') {
    dependsOn moduleZip

    doLast {
        def jars = fileTree('build/module').matching {
            include '**/*.jar'
        }.files
        if (jars.size() != 2) {
            throw new GradleException('Rack distribution must contain only its module and gateway JARs')
        }
        jars.each { archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                if (zip.entries().toList().any {
                    it.name.startsWith('org/jruby/') || it.name.startsWith('modules/bxjruby/')
                }) {
                    throw new GradleException('Rack must not bundle JRuby or core classes')
                }
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn moduleChecksum
}

tasks.register('prepareConsumer', Sync) {
    dependsOn moduleZip
    into layout.buildDirectory.dir('consumer/modules')
    from({ zipTree(tasks.moduleZip.archiveFile.get().asFile) }) {
        into 'bx-jruby-rack'
    }
    from({ zipTree(file(providers.gradleProperty('coreZip').getOrElse("../bx-jruby/build/distributions/bx-jruby-${coreVersion}.zip"))) }) {
        into 'bx-jruby'
    }
}

test {
    dependsOn prepareConsumer
    useJUnitPlatform()
    maxHeapSize = '2g'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'rack.moduleZip', tasks.moduleZip.archiveFile.get().asFile.absolutePath
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// Installed-package tests must not see main implementation classes at runtime.
sourceSets {
    integrationTest {
        java.srcDirs = ['src/test/integration/java']
        resources.srcDirs = ['src/test/integration/resources']
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath = output + configurations.testRuntimeClasspath + files(tasks.named('gatewayJar'))
    }
}

tasks.register('httpTest', Test) {
    dependsOn prepareConsumer, gatewayJar
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    exclude '**/BenchmarkTest.class'
    maxHeapSize = '2g'
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'failed', 'skipped', 'passed'
        exceptionFormat = 'full'
    }
}

tasks.register('benchmark', Test) {
    dependsOn prepareConsumer, gatewayJar
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    include '**/BenchmarkTest.class'
    maxHeapSize = '2g'
    testLogging {
        events 'failed', 'passed'
        exceptionFormat = 'full'
    }
}

// Installed implementations are intentionally absent from the host classpath. Declare
// their archives and Ruby fixtures explicitly so protocol/core changes rerun acceptance tests.
tasks.withType(Test).configureEach {
    inputs.file(tasks.named('moduleZip', Zip).flatMap { it.archiveFile })
    inputs.file(providers.gradleProperty('coreZip').map { file(it) }
        .orElse(provider { file("../bx-jruby/build/distributions/bx-jruby-${coreVersion}.zip") }))
    inputs.files(fileTree('src/test/fixtures') {
        exclude '**/log/**', '**/tmp/**', '**/vendor/**', '**/.bundle/**'
    })
}

tasks.named('httpTest') {
    // External database state is not a cacheable test input.
    outputs.upToDateWhen { !providers.environmentVariable('BX_RAILS_DATABASE_URL').isPresent() }
}

// Network access occurs only in this explicitly invoked preparation task.
['custom', 'sinatra', 'rails'].each { fixture ->
    tasks.register("prepare${fixture.capitalize()}Bundle", JavaExec) {
        dependsOn prepareConsumer
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        classpath = files(layout.buildDirectory.file('consumer/modules/bx-jruby/libs/jruby-complete-10.1.2.0.jar'))
        mainClass = 'org.jruby.Main'
        args file('src/test/prepare_bundle.rb').absolutePath, file("src/test/fixtures/${fixture}").absolutePath,
            layout.buildDirectory.dir("bundles/${fixture}").get().asFile.absolutePath,
            (providers.gradleProperty('updateFixtureLocks').isPresent() ? 'update' : 'frozen')
    }
}

tasks.register('prepareFixtures') {
    dependsOn prepareCustomBundle, prepareSinatraBundle, prepareRailsBundle
}

tasks.register('consumerTest', JavaExec) {
    dependsOn prepareConsumer
    classpath = configurations.testRuntimeClasspath.filter {
        it.name.startsWith('boxlang-') && !it.name.startsWith('boxlang-servlet-')
    }
    mainClass = 'ortus.boxlang.runtime.BoxRunner'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args '--bx-home', layout.buildDirectory.dir('cli/home').get().asFile.absolutePath,
        '--bx-config', file('src/test/bx/boxlang.json').absolutePath, file('src/test/bx/Smoke.bxs').absolutePath
}

tasks.register('testBox', JavaExec) {
    dependsOn prepareConsumer
    classpath = configurations.testRuntimeClasspath.filter {
        it.name.startsWith('boxlang-') && !it.name.startsWith('boxlang-servlet-')
    }
    mainClass = 'ortus.boxlang.runtime.BoxRunner'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    args '--bx-home', layout.buildDirectory.dir('testbox/home').get().asFile.absolutePath,
        '--bx-config', file('src/test/bx/boxlang.json').absolutePath,
        file('testbox/system/runners/BoxLangRunner.bx').absolutePath,
        '--directory=src.test.bx.specs', '--stream', '--write-report=true', '--write-json-report=true',
        "--reportpath=${layout.buildDirectory.dir('testbox/report').get().asFile.absolutePath}",
        '--properties-summary=false', '--stacktrace=short'

    doFirst {
        if (!file('testbox/system/runners/BoxLangRunner.bx').exists()) {
            throw new GradleException('Install TestBox before running testBox; see README.md')
        }
        delete layout.buildDirectory.dir('testbox/report').get().asFile
    }

    doLast {
        def report = new groovy.json.JsonSlurper().parse(file('build/testbox/report/report.json'))
        if (report.totalFail != 0 || report.totalError != 0 || report.totalPass <= 0) {
            throw new GradleException('TestBox failed or ran no passing tests')
        }
    }
}

tasks.named('check') {
    dependsOn verifyPackage, consumerTest, httpTest, javadoc
}
