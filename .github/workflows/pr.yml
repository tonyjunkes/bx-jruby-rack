name: PR

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verify module
    uses: ./.github/workflows/checks.yml
    with:
      # Companion core work can be verified before its release tag exists.
      # Release checks always use checks.yml's pinned default instead.
      core_ref: ${{ vars.BX_JRUBY_PR_CORE_REF || '1.2.0' }}
